# Build api + web Docker images in GitHub Actions and push to GHCR.
# On success, deploy-production.yml SSHs to VPS and runs: bash deploy.sh pull
# Manual retry: .\scripts\deploy-pull.ps1
#
# One-time: GHCR packages Public + GitHub secrets VPS_HOST, VPS_USER, VPS_SSH_KEY (see DEPLOY.md).

name: Publish Docker images

on:
  push:
    branches: [AIpoorna]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./api
            dockerfile: ./api/Dockerfile
            image: ghcr.io/stibe-labs/poornasree-ai-api
          - service: web
            context: .
            dockerfile: ./Dockerfile
            image: ghcr.io/stibe-labs/poornasree-ai-web
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (${{ matrix.service }})
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=AIpoorna
            type=sha,prefix=

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
