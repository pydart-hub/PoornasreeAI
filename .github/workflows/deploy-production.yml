# After CI pushes api + web images to GHCR, SSH to VPS and pull/restart (~1–3 min).
# One-time: add GitHub repo secrets (see DEPLOY.md — Fast deploy via GitHub).

name: Deploy production (pull images)

on:
  workflow_run:
    workflows: ["Publish Docker images"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'AIpoorna'
      )

    steps:
      - name: Deploy on VPS (git pull + GHCR pull)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: "22"
          command_timeout: 20m
          script: |
            set -e
            cd /root/poornasree-ai
            export IMAGE_TAG=AIpoorna
            export SKIP_OLLAMA=1
            bash deploy.sh pull

      - name: Verify API health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: "22"
          script: |
            curl -sf http://127.0.0.1:4002/health && echo " API OK" || (echo " API failed"; exit 1)
