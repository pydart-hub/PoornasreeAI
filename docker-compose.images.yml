# ── Pre-built images from GitHub Actions (optional) ───────────────────────
# Use with: docker compose -f docker-compose.yml -f docker-compose.images.yml
# Or: bash deploy.sh pull
#
# Images are built by .github/workflows/publish-images.yml
# Default tag matches branch AIpoorna.

services:
  api:
    image: ${API_IMAGE:-ghcr.io/stibe-labs/poornasree-ai-api:${IMAGE_TAG:-AIpoorna}}
  web:
    image: ${WEB_IMAGE:-ghcr.io/stibe-labs/poornasree-ai-web:${IMAGE_TAG:-AIpoorna}}
