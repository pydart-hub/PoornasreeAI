# ── PoornasreeAI — full stack ────────────────────────────────────────────────
# Services:
#   web      → Next.js 14 frontend      (host port 3000, proxied by Nginx)
#   api      → Express 5 backend        (host port 4000, proxied by Nginx)
#   db       → PostgreSQL 16            (internal only)
#   qdrant   → Qdrant vector DB         (internal only)
#   ollama   → Ollama LLM server        (internal only)
#   n8n      → n8n workflow automation  (host port 5678)
#
# Usage:
#   1. Copy .env.example → .env and fill in secrets
#   2. docker compose up --build -d
#   3. First run only: docker compose exec api npx prisma migrate deploy
#   4. First run only: docker compose exec api npx prisma db seed
#   5. Pull Ollama models: docker compose exec ollama ollama pull mistral
#                          docker compose exec ollama ollama pull nomic-embed-text
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poorna_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-poornasree_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poorna_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Qdrant vector database ─────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - internal

  # ── Ollama LLM server ──────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal
    # Uncomment to enable GPU (NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Express API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-poorna_user}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-poornasree_ai}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-}
      WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN:-}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-}
      WA_ENGINEER_SETUP_TEMPLATE: ${WA_ENGINEER_SETUP_TEMPLATE:-}
      WA_ENGINEER_SETUP_TEMPLATE_LANG: ${WA_ENGINEER_SETUP_TEMPLATE_LANG:-en}
      WA_ENGINEER_TICKET_TEMPLATE: ${WA_ENGINEER_TICKET_TEMPLATE:-}
      WA_ENGINEER_TICKET_TEMPLATE_LANG: ${WA_ENGINEER_TICKET_TEMPLATE_LANG:-en}
      FRONTEND_URL: ${FRONTEND_URL:-https://ai.poornasreecloud.com}
      INTEGRATION_WEBHOOK_URL: ${INTEGRATION_WEBHOOK_URL:-}
    volumes:
      - api_uploads:/app/uploads
      - ./data/training/training.json:/app/data/training.json:ro
      - ./data/training/customer-training.json:/app/data/customer-training.json:ro
      - ./data/training/chatbot-training.json:/app/data/chatbot-training.json:ro
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - internal
      - public

  # ── Next.js frontend ───────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal
      - public

  # ── n8n workflow automation ────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - internal
      - public

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  api_uploads:
  n8n_data:

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
